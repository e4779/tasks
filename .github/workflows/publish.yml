# Publish @e4779/tasks to npm on a manual version tag (v*).
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The package
# on npmjs.com must list this repo + workflow file as its trusted
# publisher; this job supplies the id-token npm exchanges for a
# short-lived publish credential. Requires npm >= 11.5.1 (node 24 ships
# npm 11.x).
# Gates must pass BEFORE publish — a red test or a failed smoke aborts
# the release.
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm version (trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: install
        run: bun install --frozen-lockfile

      - name: gates
        run: |
          bun run check:full
          bun test

      - name: build
        run: bun run build

      - name: node smoke (compiled dist)
        run: |
          node dist/tsk.js list .
          node dist/tsk.js check .
          node bin/tsk.ts list .

      - name: npmrc — registry only, no auth token (OIDC)
        run: echo "registry=https://registry.npmjs.org/" > ./.npmrc

      - name: publish (OIDC)
        run: npm publish --access public
