<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tsk</title>
    <link rel="stylesheet" href="/vendor/normalize.min.css" />
    <link rel="stylesheet" href="/vendor/theme.dark.switch.min.css" />
    <link rel="stylesheet" href="/vendor/sizes.min.css" />
    <link rel="stylesheet" href="/vendor/colors.min.css" />
    <link rel="stylesheet" href="/vendor/shadows.min.css" />
    <link rel="stylesheet" href="/vendor/easings.min.css" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--surface-1); color: var(--text-2); }
      nav { display: flex; gap: var(--size-1); padding: var(--size-2) var(--size-3); border-bottom: 1px solid var(--surface-3); }
      nav a { color: var(--text-2); text-decoration: none; padding: var(--size-1) .7rem; border-radius: 6px; transition: color .2s var(--ease-2), background-color .2s var(--ease-2); }
      nav a.active { background: var(--surface-3); color: var(--text-1); }
      #filters { display: flex; gap: var(--size-2); align-items: center; flex-wrap: wrap; padding: var(--size-2) var(--size-3); }
      #q { background: var(--surface-2); color: inherit; border: 1px solid var(--surface-3); border-radius: 6px; padding: .35rem .6rem; min-width: 18rem; }
      button[data-chip] { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--surface-3); border-radius: 999px; padding: .2rem .7rem; cursor: pointer; transition: color .2s var(--ease-2), background-color .2s var(--ease-2), border-color .2s var(--ease-2); }
      button[data-chip][aria-pressed="true"] { color: var(--surface-1); }
      button[data-chip="pending"][aria-pressed="true"] { background: var(--orange-6); border-color: var(--orange-6); }
      button[data-chip="in-progress"][aria-pressed="true"] { background: var(--blue-6); border-color: var(--blue-6); }
      button[data-chip="done"][aria-pressed="true"] { background: var(--green-6); border-color: var(--green-6); }
      button[data-chip="cancelled"][aria-pressed="true"] { background: var(--red-6); border-color: var(--red-6); }
      button[data-chip="blocked"][aria-pressed="true"] { background: var(--indigo-6); border-color: var(--indigo-6); }
      main { padding: 0 var(--size-3) var(--size-6); }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid var(--surface-3); }
      .path { color: var(--text-2); font-family: ui-monospace, monospace; font-size: .85em; word-break: break-all; }
      .st.pending { color: var(--orange-6); }
      .st.in-progress { color: var(--blue-6); }
      .st.done { color: var(--green-6); }
      .st.cancelled { color: var(--red-6); text-decoration: line-through; }
      .st.none { color: var(--gray-6); }
      .next-item { display: flex; gap: var(--size-3); align-items: baseline; padding: .4rem 0; border-bottom: 1px solid var(--surface-3); }
      tbody tr { cursor: pointer; }
      tsk-graph { display: block; height: 70vh; background: var(--surface-1); border: 1px solid var(--surface-3); border-radius: 8px; box-shadow: var(--shadow-2); }
      tsk-graph svg { display: block; border-radius: 8px; }
      tsk-graph .edge { fill: none; stroke-width: 1.5; }
      tsk-graph .edge.trunk { stroke: var(--gray-6); }
      tsk-graph .edge.hard { stroke: var(--blue-5); }
      tsk-graph .edge.soft { stroke: var(--gray-7); stroke-dasharray: 5 4; }
      tsk-graph .edge.broken { stroke: var(--red-5); stroke-dasharray: 2 4; }
      tsk-graph .edge.cycle { stroke: var(--red-6); stroke-dasharray: none; }
      tsk-graph .card { cursor: pointer; }
      tsk-graph .card .box { fill: var(--surface-2); stroke: var(--surface-4); }
      tsk-graph .card.ghost .box { stroke-dasharray: 3 3; }
      tsk-graph .card.dim { opacity: .4; }
      tsk-graph .card .bar { fill: var(--gray-6); }
      tsk-graph .card.st-pending .bar { fill: var(--orange-6); }
      tsk-graph .card.st-in-progress .bar { fill: var(--blue-6); }
      tsk-graph .card.st-done .bar { fill: var(--green-6); }
      tsk-graph .card.st-cancelled .bar { fill: var(--red-6); }
      tsk-graph .card.st-blocked .bar { fill: var(--indigo-6); }
      tsk-graph .card.st-none .bar { fill: var(--gray-6); }
      tsk-graph .card text { fill: var(--text-1); font: 12px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
      tsk-doc .back { display: inline-block; padding: var(--size-3) 0; color: var(--text-2); text-decoration: none; }
      tsk-doc pre { white-space: pre-wrap; background: var(--surface-1); border: 1px solid var(--surface-3); border-radius: 8px; padding: var(--size-3); box-shadow: var(--shadow-2); }
      tsk-doc .md h1, tsk-doc .md h2, tsk-doc .md h3 { color: var(--text-1); margin: var(--size-4) 0 var(--size-2); line-height: 1.25; }
      tsk-doc .md h1 { font-size: 1.4rem; }
      tsk-doc .md h2 { font-size: 1.25rem; }
      tsk-doc .md h3 { font-size: 1.1rem; }
      tsk-doc .md p { margin: var(--size-2) 0; }
      tsk-doc .md ul, tsk-doc .md ol { margin: var(--size-2) 0; padding-left: var(--size-5); }
      tsk-doc .md li { margin: var(--size-1) 0; }
      tsk-doc .md li > input[type="checkbox"] { margin-right: var(--size-2); accent-color: var(--blue-6); }
      tsk-doc .md a { color: var(--blue-4); }
      tsk-doc .md :not(pre) > code { background: var(--surface-2); border-radius: 4px; padding: 0 .3em; font-family: ui-monospace, monospace; font-size: .9em; }
      tsk-doc details { margin-top: var(--size-5); }
      tsk-doc summary { cursor: pointer; color: var(--text-2); padding: var(--size-2) 0; }
    </style>
  </head>
  <body>
    <tsk-app></tsk-app>
    <script src="/vendor/d3.min.js"></script>
    <script src="/vendor/elk.bundled.js"></script>
    <script src="/vendor/markdown-it.umd.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
